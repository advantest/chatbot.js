<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<title>chatbot.js - Sample</title>
	<link rel="stylesheet" href="chatbot.min.css">
	<style>
		/* chatbot.js as an app covering the full website. */
		html, body {
			width: 100%;
			height: 100%;
			overflow: hidden;
			margin: 0;
			padding: 0;
		}
	</style>
	<link rel="stylesheet" href="katex.min.css">
</head>
<body>
<script type="text/javascript" src="chatbot.compat.min.js"></script>
<script type="text/javascript">

var uiConfig= {
	title: 'chatbot.js',
	attach: true,
	footerHtml: 'A chatbot can make mistakes. Check important info.'
};
var containerElement= document.getElementsByTagName('body')[0];
if (!window.location.href.startsWith('file:')) {
	chatbotUi(chatbot({history: 'indexeddb'}), containerElement, uiConfig).typeEverywhere(true);
} else {
	function getContentStr(content) {
		if (typeof content === 'string') return content;
		if (!content) return '[no content]';
		var imageCount= 0;
		var text;
		for (const contentPart of content) {
			if ('text' == contentPart.type && typeof contentPart.text === 'string') {
				text= contentPart.text;
			} else if ('image_url' == contentPart.type) {
				imageCount++;
			}
		}
		return (imageCount ? (imageCount > 1 ? '[' + imageCount + ' images]' : '[image]') : '[empty]') +
			(text ? ' ' + text : '');
	}

	// Dummy connector when there is no API:
	// A chatbot that responds with the question in uppercase (delay: 0.8s)
	var config= {
		connector: (callback, msg) => {
			return new Promise((resolve) => {
				setTimeout(() => {
					callback(getContentStr(msg).toUpperCase(), true);
					resolve();
				}, 800);
			});
		},
		history: 'indexeddb'
	};
	chatbotUi(chatbot(config), containerElement, uiConfig).typeEverywhere(true);

}

</script>
</body>
</html>
